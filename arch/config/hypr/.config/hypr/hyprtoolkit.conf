# ~/.config/hypr/hyprtoolkit.conf
# Gruvbox Dark theme for hyprtoolkit

# Colors (Gruvbox Dark palette)
background             = 0xFF282828  # bg0
base                    = 0xFF1D2021  # bg0_h (darker, for input fields/panels)
text                    = 0xFFEBDBB2  # fg1
alternate_base          = 0xFF3C3836  # bg1
bright_text             = 0xFFFBF1C7  # fg0
accent                  = 0xFF8EC07C  # bright aqua
accent_secondary        = 0xFFFE8019  # bright orange

# Fonts
h1_size                 = 19
h2_size                 = 15
h3_size                 = 13
font_size               = 11
small_font_size         = 10

icon_theme              =
font_family             = Sans Serif
font_family_monospace   = monospace

# Rounding
rounding_large          = 10
rounding_small          = 5
